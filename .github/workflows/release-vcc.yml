name: Build and Release DXCB5 VCC Package

on:
  schedule:
    # 08:00 JST (UTC+9) every day
    - cron: '0 23 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional SemVer override (e.g. 0.1.0). Leave empty to auto-assign.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-vcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine release plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        shell: python3 {0}
        run: |
          import json, os, re, subprocess, pathlib

          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          pkg = json.loads(pathlib.Path("projects/dxcb5/unity-vcc/com.moepus.dxcb5/package.json").read_text())
          base_ver = pkg["version"]
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)", base_ver)
          major, minor, patch = (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else (0, 1, 0)

          def write_out(should, ver, tag):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"should_build={'true' if should else 'false'}\n")
                  f.write(f"version={ver}\n")
                  f.write(f"tag={tag}\n")
                  f.write(f"head_sha={head_sha}\n")
              print(f"Plan: should_build={should} version={ver} tag={tag} head={head_sha[:10]}")

          ev = os.environ["EVENT_NAME"]
          if ev == "push":
              tag = os.environ["REF_NAME"]
              ver = tag[1:] if tag.startswith("v") else tag
              write_out(True, ver, tag)
              raise SystemExit(0)

          # Inspect latest release on GitHub
          last_sha = ""
          max_patch = patch - 1
          try:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=20"],
                  text=True,
              )
              rels = [r for r in json.loads(raw) if not r.get("draft")]
              if rels:
                  latest = rels[0]
                  body = latest.get("body") or ""
                  cm = re.search(r"Commit:\s*([0-9a-fA-F]{40})", body)
                  if cm:
                      last_sha = cm.group(1).lower()
                  else:
                      t = latest.get("tag_name", "")
                      if t:
                          try:
                              last_sha = subprocess.check_output(["git", "rev-list", "-n", "1", t], text=True).strip().lower()
                          except Exception:
                              pass
              for r in rels:
                  t = (r.get("tag_name") or "").lstrip("v")
                  rm = re.match(rf"^{major}\.{minor}\.(\d+)$", t)
                  if rm:
                      max_patch = max(max_patch, int(rm.group(1)))
          except Exception as exc:
              print(f"[info] Could not list existing releases: {exc}")

          if ev == "schedule" and last_sha == head_sha.lower():
              print("No new commits since last release; skipping build.")
              write_out(False, "", "")
              raise SystemExit(0)

          custom = (os.environ.get("INPUT_VERSION") or "").strip()
          if custom:
              ver = custom.lstrip("v")
          else:
              next_patch = max(patch, max_patch + 1)
              ver = f"{major}.{minor}.{next_patch}"
          write_out(True, ver, f"v{ver}")

  build-and-release:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and sccache
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            choco install sccache -y --no-progress
          }

      - name: Restore sccache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-win-x64-${{ github.sha }}
          restore-keys: |
            sccache-win-x64-

      - name: Configure CMake
        shell: pwsh
        env:
          SCCACHE_CACHE_SIZE: 4G
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -C cmake/caches/PredefinedParams.cmake `
            -DENABLE_SPIRV_CODEGEN=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_APPEND_VC_REV=OFF `
            -DCLANG_ENABLE_ARCMT=OFF `
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      - name: Build DXCB5 and Unity Proxy
        shell: pwsh
        run: |
          cmake --build build --target dxcompiler DXCB5UnityProxy dxcb5 DXCB5UnityProxyTest -j
          sccache --show-stats

      - name: Run Proxy Smoke Test
        shell: pwsh
        run: |
          ctest --test-dir build/projects/dxcb5 -R "DXCB5UnityProxy" --output-on-failure

      - name: Package VCC Zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File projects/dxcb5/unity-vcc/package_vcc.ps1 `
            -BuildDir build `
            -OutDir dist `
            -Version "${{ needs.check.outputs.version }}" `
            -TagName "${{ needs.check.outputs.tag }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.check.outputs.tag }}"
          $ver = "${{ needs.check.outputs.version }}"
          $sha = "${{ needs.check.outputs.head_sha }}"
          $zip = "dist/com.moepus.dxcb5-$ver.zip"
          $shaLine = (Get-Content -LiteralPath "dist/SHA256SUMS.txt" -Raw).Trim()
          $notes = @"
          DXCB5 SM5.0 DXBC Compiler + Unity 2022.3.22f1 VCC Package ($tag)

          - **VCC Repository**: https://moepus.github.io/vpm/ (`https://moepus.github.io/vpm/index.json`)
          - **Commit**: $sha
          - **SHA256**: `$shaLine`
          "@
          $notesPath = "dist/RELEASE_NOTES.md"
          [System.IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip dist/package.json dist/SHA256SUMS.txt --clobber
            gh release edit $tag --notes-file $notesPath
          } else {
            gh release create $tag $zip dist/package.json dist/SHA256SUMS.txt `
              --title "DXCB5 $tag" `
              --notes-file $notesPath
          }

      - name: Notify VPM Listing (optional)
        if: env.VPM_DISPATCH_TOKEN != ''
        shell: pwsh
        env:
          VPM_DISPATCH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:VPM_DISPATCH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/MoePus/vpm/dispatches" `
            -Headers $headers `
            -Body '{"event_type":"refresh-vpm"}' `
            -ContentType "application/json"
